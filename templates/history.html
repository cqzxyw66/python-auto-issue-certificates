{% extends 'layout.html' %}
{% block content %}
<section class="panel">
    <h2>申请历史</h2>
    {% if entries %}
    <table class="data-table">
        <thead>
            <tr>
                <th>时间</th>
                <th>用户名</th>
                <th>序列号</th>
                <th>域名</th>
                <th>主机名</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for row in entries %}
            <tr>
                <td>{{ row.timestamp }}</td>
                <td>{{ row.username }}</td>
                <td>{{ row.serial_number }}</td>
                <td>{{ row.domain }}</td>
                <td>{{ row.hostname }}</td>
                <td>已申请</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>暂无申请历史。</p>
    {% endif %}
</section>
{% endblock %}
